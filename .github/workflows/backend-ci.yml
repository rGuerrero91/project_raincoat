name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'raincoat_api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'raincoat_api/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: raincoat_api

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raincoat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/raincoat_test
      REDIS_URL: redis://localhost:6379/1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: raincoat_api

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load

      - name: Run RuboCop
        run: bundle exec rubocop --fail-level=E

      - name: Run Brakeman security scan
        run: bundle exec brakeman --no-summary --quiet --format json --output tmp/brakeman.json || true

      - name: Check Brakeman results
        run: |
          if [ -f tmp/brakeman.json ]; then
            if [ "$(cat tmp/brakeman.json | jq '.warnings | length')" -gt "0" ]; then
              echo "Security vulnerabilities found:"
              cat tmp/brakeman.json | jq '.warnings'
              exit 1
            fi
          fi

      - name: Run RSpec tests
        run: bundle exec rspec --format progress --format documentation

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-results
          path: raincoat_api/tmp/rspec.xml
          retention-days: 30
