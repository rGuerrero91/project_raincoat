<!DOCTYPE html>
<html>
<head>
  <title>Test YOLO Detection</title>
  <script src="./js/onnx/ort.min.js"></script>
  <script src="./js/yolo_detector.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    
    #preview {
      max-width: 50%;
      border: 2px solid #ddd;
      margin: 20px 0;
    }
    
    .result {
      background: #f0f0f0;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>YOLO Detection Test</h1>
  
  <input type="file" id="fileInput" accept="image/*">
  
  <h2>Preview</h2>
  <canvas id="preview"></canvas>
  
  <h2>Results</h2>
  <div id="results"></div>
  
  <script>
    let detector;
    
    async function init() {
      console.log('Initializing...');
      detector = new YOLODetector();
      await detector.initialize();
      console.log('Ready!');
    }
    
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      // Load image
      const img = await loadImage(file);
      
      // Draw on canvas
      const canvas = document.getElementById('preview');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      // Detect
      console.log('Running detection...');
      const detections = await detector.detect(img);
      
      // Visualize
      detector.visualizeDetections(canvas, detections);
      
      // Show results
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      
      if (detections.length === 0) {
        resultsDiv.innerHTML = '<p>No clothing items detected</p>';
      } else {
        detections.forEach((det, idx) => {
          const div = document.createElement('div');
          div.className = 'result';
          div.innerHTML = `
            <strong>Detection ${idx + 1}</strong><br>
            Category: ${det.category}<br>
            Confidence: ${(det.confidence * 100).toFixed(1)}%<br>
            Bbox: [${det.bbox.x1.toFixed(0)}, ${det.bbox.y1.toFixed(0)}, 
                   ${det.bbox.x2.toFixed(0)}, ${det.bbox.y2.toFixed(0)}]
          `;
          resultsDiv.appendChild(div);
        });
      }
    });
    
    function loadImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    
    init();
  </script>
</body>
</html>
